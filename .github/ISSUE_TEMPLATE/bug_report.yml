name: Bug report
description: Report a bug or unexpected behavior in Agentic Screenshot
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Press Alt+K
        2. Select an area
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?

  - type: input
    id: app_version
    attributes:
      label: Agentic Screenshot version
      description: Output of `agentic-screenshot --version`
      placeholder: "agentic-screenshot 2.0.1 (build ...)"
    validations:
      required: true

  - type: input
    id: os_gnome
    attributes:
      label: Ubuntu and GNOME version
      description: e.g. Ubuntu 26.04, GNOME 50
      placeholder: "Ubuntu 26.04 / GNOME 50"
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Session type
      options:
        - Wayland
        - X11
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: extension
    attributes:
      label: Is the Agentic Screenshot GNOME Shell extension enabled?
      description: Check with `gnome-extensions list --enabled | grep agentic-screenshot`
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Screenshots or logs
      description: Add any screenshots, terminal output, or extra context that might help.
